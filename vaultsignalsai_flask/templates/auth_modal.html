<div id="authModal" class="modal hidden" aria-modal="true" role="dialog">
  <div class="modal-content panel-card">
    <button id="authModalClose" class="modal-close" aria-label="Close login modal">✕</button>
    <h3>Member Access</h3>
    <div class="auth-tabs">
      <button class="tab-btn active" data-mode="login">Log In</button>
      <button class="tab-btn" data-mode="signup">Create Account</button>
    </div>

    <form id="authForm">
      <div id="usernameGroup" class="auth-input-group">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="Choose a username" />
      </div>
      <div id="fullNameGroup" class="auth-input-group">
        <label for="fullName">Full name</label>
        <input id="fullName" name="fullName" type="text" placeholder="Your full name" />
      </div>
      <div class="auth-input-group">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required />
      </div>
      <div class="auth-input-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Create a password" required />
      </div>
      <label id="rememberLoginGroup" class="remember-login-row hidden">
        <input id="rememberLogin" name="rememberLogin" type="checkbox" value="1" />
        <span>Keep me signed in on this device</span>
      </label>
      <div id="addressGroup" class="auth-input-group">
        <label for="address">Home Address</label>
        <input id="address" name="address" type="text" placeholder="123 Main St" />
      </div>
      <div id="zipcodeGroup" class="auth-input-group">
        <label for="zipcode">Zip Code</label>
        <input id="zipcode" name="zipcode" type="text" placeholder="12345" />
      </div>
      <div id="discordTagGroup" class="auth-input-group">
        <label for="discordUsername">Discord Username</label>
        <input id="discordUsername" name="discordUsername" type="text" placeholder="yourname" />
      </div>
      <div id="discordLevelGroup" class="auth-input-group">
        <label for="discordTag">Discord Tag Level (system verified)</label>
        <select id="discordTag" name="discordTag" disabled>
          <option value="">Pending verification</option>
          <option value="early_bird">Early Bird</option>
          <option value="launch">Launch</option>
          <option value="scaled">Scaled</option>
          <option value="premium">Premium</option>
          <option value="final">Final</option>
        </select>
        <small id="discordVerificationHint" class="auth-discord-status">Tag level is assigned only after system checks your Discord membership.</small>
      </div>
      <button class="submit-btn" type="submit" id="submitBtn">Create Member Account</button>
    </form>
    <p class="auth-discord-hint">Optional: connect Discord for possible discounts. <a href="https://discord.com/login" target="_blank" rel="noreferrer">Open Discord QR login</a></p>
    <div id="authMessage" class="message-box">Create an account to unlock tier checkout.</div>
  </div>
</div>
