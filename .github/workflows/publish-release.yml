name: Publish release download

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-desktop:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install desktop dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip; python -m pip install -r desktop_app/requirements.txt -r desktop_app/requirements-build.txt

      - name: Check desktop application syntax
        shell: pwsh
        run: python -m py_compile desktop_app/main.py

      - name: Build Windows desktop download
        shell: pwsh
        run: |
          $tagName = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Path "desktop-release-assets" -Force | Out-Null
          Set-Content -Path "desktop-release-assets/VaultSignalsAI-version.txt" -Value $tagName -NoNewline
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name "VaultSignalsAI" --add-data "desktop-release-assets;assets" --distpath "desktop-dist" --workpath "desktop-build" --specpath "desktop-spec" "desktop_app/main.py"
          $archiveName = "VaultSignalsAI-windows-x64-$tagName.zip"
          Compress-Archive -Path "desktop-dist/VaultSignalsAI.exe" -DestinationPath $archiveName -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $archiveName).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Set-Content -Path "$archiveName.sha256" -NoNewline

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-release
          path: |
            VaultSignalsAI-windows-x64-*.zip
            VaultSignalsAI-windows-x64-*.zip.sha256
          if-no-files-found: error

  publish:
    needs: build-windows-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Build source archive
        shell: bash
        run: |
          tag_name="${GITHUB_REF_NAME}"
          archive_name="VaultSignalsAI-Flask-${tag_name}-source.zip"
          git archive --format=zip --prefix="VaultSignalsAI-Flask-${tag_name}/" --output="${archive_name}" "${GITHUB_SHA}"
          unzip -l "${archive_name}"
          test -f "${archive_name}"
          test "$(unzip -Z1 "${archive_name}" | grep -c "^VaultSignalsAI-Flask-${tag_name}/vaultsignalsai_flask/app.py$")" -eq 1
          test "$(unzip -Z1 "${archive_name}" | grep -c "^VaultSignalsAI-Flask-${tag_name}/desktop_app/main.py$")" -eq 1
          test "$(unzip -Z1 "${archive_name}" | grep -Ec "(^|/)(__pycache__/|.*\.pyc$|.*\.db(-shm|-wal)?$|\.venv/|venv/|application/(build|dist)/)")" -eq 0
          echo "ARCHIVE_NAME=${archive_name}" >> "${GITHUB_ENV}"

      - name: Download Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: windows-desktop-release
          path: windows-release

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ARCHIVE_NAME}" windows-release/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${ARCHIVE_NAME}" windows-release/* \
              --title "VaultSignalsAI ${GITHUB_REF_NAME}" \
              --notes-file .github/release-notes.md
          fi