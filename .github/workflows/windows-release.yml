name: Build Windows download

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install packaging tools
        shell: pwsh
        run: python -m pip install --upgrade pip; python -m pip install -r requirements-build.txt

      - name: Check application syntax
        shell: pwsh
        run: python -m py_compile vaultsignals_desktop.py

      - name: Build Windows download
        shell: pwsh
        run: .\scripts\build-release.ps1 -Version "${{ github.ref_name }}"

      - name: Upload review download
        uses: actions/upload-artifact@v4
        with:
          name: VaultSignalsAI-windows-x64
          path: |
            release/VaultSignalsAI-windows-x64.zip
            release/VaultSignalsAI-windows-x64.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $releaseArgs = @(
            "release", "create", $tag,
            "release/VaultSignalsAI-windows-x64.zip",
            "release/VaultSignalsAI-windows-x64.zip.sha256",
            "--title", "VaultSignalsAI $tag",
            "--generate-notes"
          )

          if ($tag -match "(?i)beta") {
            $releaseArgs += "--prerelease"
          }

          gh @releaseArgs
